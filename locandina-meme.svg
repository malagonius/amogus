  <path d="M95 125 Q155 75 225 105" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="12"/>
  <path d="M45 275 Q155 350 270 275" fill="none" stroke="#8f2020" stroke-width="18"/>
