<text x="70" y="130" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#f1f3f5" letter-spacing="5">🚨 ATTENZIONE CREWMATE 🚨</text>
<text x="70" y="260" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#fff">NON FIDARTI.</text>
<text x="70" y="365" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#e54848">POTREBBE ESSERE</text>
<text x="70" y="455" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#e54848">UN IMPOSTORE.</text>
<rect x="70" y="520" width="940" height="150" rx="28" fill="#e54848"/>
<text x="540" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" fill="#fff">ATTIVITÀ AMONG US — IRL</text>
<text x="540" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#fff">TASK • RIUNIONI • SOSPETTI • TRADIMENTI</text>
<text x="70" y="755" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#fff">🎒 VESTITI DA AMONG US?</text>
<text x="70" y="805" font-family="Arial, sans-serif" font-size="30" fill="#cbd0d8">Se vuoi, porta felpa, cappello, zaino o qualsiasi cosa</text>
<text x="70" y="845" font-family="Arial, sans-serif" font-size="30" fill="#cbd0d8">ti faccia sembrare un crewmate. ZERO OBBLIGO. 😎</text>
<text x="70" y="940" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#fff">🧠 SERVE UNA COSA SOLA:</text>
<text x="70" y="990" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#e54848">VOGLIA DI STARE AL GIOCO.</text>
<text x="70" y="1040" font-family="Arial, sans-serif" font-size="28" fill="#cbd0d8">Collabora, fai le task, accusa i tuoi amici, bluffa.</text>
<text x="70" y="1080" font-family="Arial, sans-serif" font-size="28" fill="#cbd0d8">Più ci crediamo tutti, più sarà divertente.</text>
<rect x="70" y="1150" width="940" height="110" rx="22" fill="#252a33" stroke="#e54848" stroke-width="3"/>
<text x="540" y="1220" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" fill="#fff">☠️ CI VEDIAMO A BORDO.</text>
<text x="540" y="1300" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#aeb4be">E ricorda: chiunque può essere l'Impostore.</text>
</svg>